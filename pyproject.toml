[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rbergomi"
version = "0.1.0"
description = "Rough Bergomi (rBergomi) simulation, pricing and calibration engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hemang" }]
keywords = ["rough-volatility", "rbergomi", "monte-carlo", "quantitative-finance"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
rbergomi = "rbergomi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rbergomi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running calibration tests"]
